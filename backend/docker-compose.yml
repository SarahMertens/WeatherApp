services:
  db:
    image: mysql:8.0

    ports:
      - '3307:3306'

    volumes:
      - weather_db_data:/var/lib/mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: weather
      MYSQL_USER: devusr
      MYSQL_PASSWORD: devpwd

    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '--silent',
        ]
      timeout: 30s
      interval: 30s
      retries: 5
      start_period: 30s

volumes:
  weather_db_data: